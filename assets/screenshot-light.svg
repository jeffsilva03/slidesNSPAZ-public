<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="535" viewBox="0 0 1100 535" role="img" aria-label="Fluxo ilustrado de Slides NSPAZ"><rect width="1100" height="535" rx="16" fill="#F5F8FF"/><rect x="22" y="22" width="1056" height="491" rx="10" fill="#FFFFFF" stroke="#2379E8" stroke-opacity=".4"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="75" fill="#475569" font-size="15">SLIDES NSPAZ / FLUXO ILUSTRADO</text><text x="48" y="151" fill="#0F1E3A" font-size="21">1. Informe o texto e escolha o tipo de celebração</text><text x="48" y="227" fill="#0F1E3A" font-size="21">2. Opcional: envie um modelo .pptx próprio</text><text x="48" y="303" fill="#0F1E3A" font-size="21">3. POST /api?action=generate</text><text x="48" y="379" fill="#0F1E3A" font-size="21">4. GET /api?action=download&amp;file=exemplo.pptx</text><text x="48" y="455" fill="#0F1E3A" font-size="21">Resultado: apresentação editável em PowerPoint</text></g></svg>
